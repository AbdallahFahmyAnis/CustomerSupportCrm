<section class="page">
  <header class="row">
    <div>
      <h1>Roles List</h1>
      <p class="lede">
        A role provides access to predefined menus and features so administrators can grant what each user needs.
      </p>
    </div>
    <a routerLink="/admin/roles/permissions" class="btn secondary">Permissions</a>
  </header>

  @if (store.error()) {
    <p class="error">{{ store.error() }}</p>
  }

  <div class="role-grid">
    @for (r of store.roles(); track r.name) {
      <crm-role-card
        [name]="r.name"
        [description]="r.description"
        [permissions]="r.permissions"
        [userCountLabel]="r.permissions.length + ' permissions'"
        (edit)="openPermissions()"
      />
    }
  </div>
</section>
