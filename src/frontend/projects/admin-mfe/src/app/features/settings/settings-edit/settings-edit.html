<section class="page">
  <h1>System settings</h1>
  <p class="lede">Organization identity and login lockout policy.</p>

  @if (store.error()) {
    <p class="error">{{ store.error() }}</p>
  }
  @if (store.saved()) {
    <p class="ok">Settings saved.</p>
  }
  @if (store.loading()) {
    <p>Loading…</p>
  } @else {
    <form class="form" (ngSubmit)="submit()">
      <label>
        Organization name
        <input name="organizationName" [(ngModel)]="organizationName" required />
      </label>
      <label>
        Support email
        <input name="supportEmail" type="email" [(ngModel)]="supportEmail" required />
      </label>
      <label>
        Default culture
        <select name="defaultCulture" [(ngModel)]="defaultCulture" required>
          <option value="en">English (en)</option>
          <option value="ar">Arabic (ar)</option>
        </select>
      </label>
      <label>
        Max failed login attempts
        <input
          name="maxFailedLoginAttempts"
          type="number"
          min="1"
          max="20"
          [(ngModel)]="maxFailedLoginAttempts"
          required
        />
      </label>
      <label>
        Lockout minutes
        <input
          name="lockoutMinutes"
          type="number"
          min="1"
          max="1440"
          [(ngModel)]="lockoutMinutes"
          required
        />
      </label>
      <button type="submit" class="btn" [disabled]="store.saving()">
        {{ store.saving() ? 'Saving…' : 'Save' }}
      </button>
    </form>
  }
</section>
