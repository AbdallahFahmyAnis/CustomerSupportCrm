<section class="page">
  <p><a routerLink="/admin/users">← Users</a></p>
  <header class="row">
    <div>
      <h1>Create user</h1>
      <p class="lede">Account details, access, then review</p>
    </div>
  </header>

  @if (store.error()) {
    <p class="error">{{ store.error() }}</p>
  }

  <crm-wizard
    [steps]="steps"
    [(step)]="step"
    [canNext]="canAdvance()"
    finishLabel="Create user"
    (finish)="submit()"
  >
    <ng-template crmWizardStep>
      <div class="form-grid">
        <label>
          Email
          <input name="email" type="email" [(ngModel)]="email" required />
        </label>
        <label>
          Display name
          <input name="displayName" [(ngModel)]="displayName" required />
        </label>
      </div>
    </ng-template>

    <ng-template crmWizardStep>
      <div class="form-grid">
        <label>
          Password
          <input name="password" type="password" [(ngModel)]="password" required />
        </label>
        <label>
          Role
          <select name="role" [(ngModel)]="role" required>
            @for (r of store.roles(); track r.name) {
              <option [value]="r.name">{{ r.name }}</option>
            }
          </select>
        </label>
      </div>
    </ng-template>

    <ng-template crmWizardStep>
      <h3 class="review-title">Review & create</h3>
      <table class="review-table">
        <tr>
          <th>Email</th>
          <td>{{ email }}</td>
        </tr>
        <tr>
          <th>Display name</th>
          <td>{{ displayName }}</td>
        </tr>
        <tr>
          <th>Role</th>
          <td>{{ role }}</td>
        </tr>
      </table>
    </ng-template>
  </crm-wizard>
</section>
