<section class="page">
  <p><a [routerLink]="['/agent/customers', id]">← Back</a></p>
  <header class="row">
    <div>
      <h1>Edit customer</h1>
      <p class="lede">Update profile and organization details</p>
    </div>
  </header>

  <crm-wizard
    [steps]="steps"
    [(step)]="step"
    [canNext]="canAdvance()"
    finishLabel="Save changes"
    (finish)="save()"
  >
    <ng-template crmWizardStep>
      <div class="form-grid">
        <label>
          Name
          <input name="displayName" [(ngModel)]="displayName" required />
        </label>
        <label>
          Unique identifier
          <input name="uniqueIdentifier" [(ngModel)]="uniqueIdentifier" required />
        </label>
      </div>
    </ng-template>

    <ng-template crmWizardStep>
      <div class="form-grid">
        <label>
          Organization
          <input name="organization" [(ngModel)]="organization" />
        </label>
        <label>
          Status
          <select name="status" [(ngModel)]="status">
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </label>
      </div>
    </ng-template>

    <ng-template crmWizardStep>
      <h3 class="review-title">Review changes</h3>
      <table class="review-table">
        <tr>
          <th>Name</th>
          <td>{{ displayName }}</td>
        </tr>
        <tr>
          <th>Unique identifier</th>
          <td>{{ uniqueIdentifier }}</td>
        </tr>
        <tr>
          <th>Organization</th>
          <td>{{ organization || '—' }}</td>
        </tr>
        <tr>
          <th>Status</th>
          <td>{{ status }}</td>
        </tr>
      </table>
    </ng-template>
  </crm-wizard>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <crm-modal [(open)]="dupOpen" title="Possible duplicate">
    <p>{{ warning()?.message }}</p>
    <div crmModalActions>
      <button type="button" class="btn secondary" (click)="dupOpen = false">Close</button>
    </div>
  </crm-modal>
</section>
