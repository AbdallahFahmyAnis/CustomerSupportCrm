<div class="auth-basic">
  <section class="auth-panel">
    <img class="logo" src="/brand/azm-squad.png" alt="AZM Squad" width="160" height="160" />
    <h1>{{ lang.t('resetPassword') }}</h1>
    <p class="lead">{{ lang.t('resetPasswordLead') }}</p>

    <form class="auth-form" #f="ngForm" (ngSubmit)="submit(f)">
      <label>
        {{ lang.t('email') }}
        <input name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
      <label>
        {{ lang.t('resetToken') }}
        <input name="token" [(ngModel)]="token" required autocomplete="off" />
      </label>
      <label>
        {{ lang.t('newPassword') }}
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          minlength="6"
          autocomplete="new-password"
        />
      </label>
      <label>
        {{ lang.t('confirmPassword') }}
        <input
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
        />
      </label>
      <button type="submit" class="btn" [disabled]="saving">
        {{ saving ? lang.t('saving') : lang.t('resetPassword') }}
      </button>
    </form>

    <p class="auth-links">
      <a routerLink="/login">{{ lang.t('backToSignIn') }}</a>
    </p>
  </section>
</div>
