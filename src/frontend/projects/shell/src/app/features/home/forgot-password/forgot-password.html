<div class="auth-basic">
  <section class="auth-panel">
    <img class="logo" src="/brand/azm-squad.png" alt="AZM Squad" width="160" height="160" />
    <h1>{{ lang.t('forgotPassword') }}</h1>
    <p class="lead">{{ lang.t('forgotPasswordLead') }}</p>

    @if (!done) {
      <form class="auth-form" #f="ngForm" (ngSubmit)="submit(f)">
        <label>
          {{ lang.t('email') }}
          <input
            name="email"
            type="email"
            [(ngModel)]="email"
            required
            autocomplete="username"
            #emailCtrl="ngModel"
          />
          @if (f.submitted && emailCtrl.invalid) {
            <span class="field-error">{{ lang.t('fieldRequired') }}</span>
          }
        </label>
        <button type="submit" class="btn" [disabled]="saving">
          {{ saving ? lang.t('saving') : lang.t('sendResetLink') }}
        </button>
      </form>
    } @else {
      <p class="lead">{{ lang.t('forgotPasswordSent') }}</p>
      @if (devResetToken) {
        <p class="lead">{{ lang.t('devResetHint') }}</p>
        <p class="auth-links">
          <a [routerLink]="['/reset-password']" [queryParams]="{ email, token: devResetToken }">
            {{ lang.t('continueReset') }}
          </a>
        </p>
      }
    }

    <p class="auth-links">
      <a routerLink="/login">{{ lang.t('backToSignIn') }}</a>
      ·
      <a routerLink="/register">{{ lang.t('createAccount') }}</a>
    </p>
  </section>
</div>
