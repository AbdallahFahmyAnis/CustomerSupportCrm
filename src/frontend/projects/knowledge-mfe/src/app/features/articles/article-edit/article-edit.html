<section class="page">
  <p><a routerLink="/knowledge">← {{ lang.t('backToArticles') }}</a></p>

  <header class="row">
    <div>
      <h1>{{ isNew ? lang.t('newArticle') : lang.t('editArticle') }}</h1>
      <p class="lede">{{ lang.t('articleAuthorLead') }}</p>
    </div>
  </header>

  @if (!isNew && store.loading() && !store.selected()) {
    <p>{{ lang.t('loading') }}</p>
  } @else {
    <form class="form" #f="ngForm" (ngSubmit)="save(f)">
      <label>
        {{ lang.t('title') }}
        <input name="title" [(ngModel)]="title" required #titleCtrl="ngModel" />
        @if (f.submitted && titleCtrl.invalid) {
          <span class="field-error">{{ lang.t('fieldRequired') }}</span>
        }
      </label>
      <label>
        {{ lang.t('kind') }}
        <select name="kind" [(ngModel)]="kind">
          @for (k of kinds; track k) {
            <option [value]="k">{{ k }}</option>
          }
        </select>
      </label>
      <label>
        {{ lang.t('status') }}
        <select name="status" [(ngModel)]="status">
          @for (s of statuses; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </label>
      <label class="body">
        {{ lang.t('body') }}
        <textarea name="body" rows="12" [(ngModel)]="body" required #bodyCtrl="ngModel"></textarea>
        @if (f.submitted && bodyCtrl.invalid) {
          <span class="field-error">{{ lang.t('fieldRequired') }}</span>
        }
      </label>
      <button type="submit" class="btn" [disabled]="store.saving()">
        {{ store.saving() ? lang.t('saving') : lang.t('save') }}
      </button>
    </form>
  }
</section>
