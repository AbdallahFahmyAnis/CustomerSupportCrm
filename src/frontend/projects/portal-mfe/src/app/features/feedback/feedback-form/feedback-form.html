<section class="page">
  <nav class="crumb-nav" aria-label="Breadcrumb">
    <a routerLink="/portal">Portal</a>
    <span class="sep" aria-hidden="true">/</span>
    <span class="current">Feedback</span>
  </nav>

  <header class="row">
    <div>
      <h1>Rate your support</h1>
      <p class="lede">After your ticket is resolved, share a 1–5 rating and optional comment.</p>
    </div>
  </header>

  <div class="settings-card">
    <form class="settings-form" (ngSubmit)="submit()">
      <div class="settings-form-grid">
        <label class="full">
          Ticket number
          <input
            name="ticketNumber"
            [(ngModel)]="ticketNumber"
            placeholder="TKT-1001"
            autocomplete="off"
            required
          />
        </label>
        <label>
          Rating
          <select name="rating" [(ngModel)]="rating">
            <option [ngValue]="5">5 — Excellent</option>
            <option [ngValue]="4">4 — Good</option>
            <option [ngValue]="3">3 — Okay</option>
            <option [ngValue]="2">2 — Poor</option>
            <option [ngValue]="1">1 — Very poor</option>
          </select>
        </label>
        <label class="full">
          Comment (optional)
          <textarea name="comment" rows="4" [(ngModel)]="comment" placeholder="What went well or could improve?"></textarea>
        </label>
      </div>
      <div class="settings-actions">
        <button type="submit" class="btn" [disabled]="store.submitting()">
          {{ store.submitting() ? 'Submitting…' : 'Submit feedback' }}
        </button>
      </div>
    </form>
  </div>

  @if (store.error(); as err) {
    <p class="error" role="alert">{{ err }}</p>
  }
  @if (store.success(); as ok) {
    <p class="ok" role="status">Thanks — rating {{ ok.rating }}/5 saved for this ticket.</p>
  }
</section>
