<section class="page">
  <nav class="crumb-nav" aria-label="Breadcrumb">
    <a routerLink="/portal">Portal</a>
    <span class="sep" aria-hidden="true">/</span>
    <span class="current">Live chat</span>
  </nav>

  <header class="row">
    <div>
      <h1>Live chat</h1>
      <p class="lede">Message support — your conversation becomes a ticket.</p>
    </div>
  </header>

  @if (!ticketId) {
    <div class="identity-card settings-card">
      <form class="settings-form" (ngSubmit)="$event.preventDefault()">
        <div class="settings-form-grid">
          <label>
            Name
            <input name="name" [(ngModel)]="name" autocomplete="name" />
          </label>
          <label>
            Email
            <input name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
          </label>
        </div>
      </form>
    </div>
  }

  <crm-chat
    [title]="chatTitle"
    [subtitle]="chatSubtitle"
    avatarText="S"
    [messages]="messages()"
    [(draft)]="draft"
    [sending]="sending()"
    [composeDisabled]="!email.trim()"
    placeholder="Type a message…"
    sendLabel="Send"
    emptyText="Say hello to start a conversation with support."
    (send)="onSend($event)"
  />

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <p class="back-link"><a routerLink="/portal">← Portal home</a></p>
</section>
