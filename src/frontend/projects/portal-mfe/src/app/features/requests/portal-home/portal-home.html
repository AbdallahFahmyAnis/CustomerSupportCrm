<section class="workspace">
  <header class="row">
    <div>
      <h1>Customer portal</h1>
      <p class="lede">Submit a support request or track requests you already opened.</p>
    </div>
  </header>

  <div class="action-grid home-actions">
    <a routerLink="submit" class="action-tile featured">
      <span class="tile-kicker">New</span>
      <strong>Submit a request</strong>
      <span>Open a ticket from the web form</span>
    </a>
    <a routerLink="chat" class="action-tile featured">
      <span class="tile-kicker">Chat</span>
      <strong>Live chat</strong>
      <span>Message an agent in real time</span>
    </a>
    <a routerLink="track" class="action-tile featured">
      <span class="tile-kicker">Status</span>
      <strong>Track my requests</strong>
      <span>Look up tickets by email</span>
    </a>
  </div>
</section>
